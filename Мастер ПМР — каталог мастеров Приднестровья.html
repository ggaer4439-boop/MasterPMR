<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастер ПМР — каталог мастеров Приднестровья</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e7eb;--brand:#2547f5;--navy:#0f1b3d;--call:#16a34a;--tg:#229ed9;--err:#dc2626;--r:18px;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;min-height:100vh;padding-bottom:100px;overflow-x:clip;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;height:60px}
header nav{display:none}
.logo{font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.4px}
.logo b{background:var(--brand);color:#fff;padding:1px 8px;border-radius:8px;margin-left:4px}
h1{font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-1.8px;margin:28px 0 12px;font-weight:800}
h2{font-size:24px;letter-spacing:-.5px;margin:40px 0 14px}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-height:50px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,71,245,.12)}
textarea{min-height:110px;resize:vertical}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 10px 30px -12px rgba(15,23,42,.18)}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1 1 auto;width:auto;border:0;background:transparent;box-shadow:none;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;border:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;background:var(--ink);color:#fff;transition:transform .15s,background .15s}
.btn:hover{background:#1e293b;transform:translateY(-1px)}
.btn.sun{background:var(--call)}.btn.sun:hover{background:#15803d}
.btn.tg{background:var(--tg)}.btn.tg:hover{background:#1b8bc0}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 12px -4px rgba(15,23,42,.2)}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* баннер */
.banner{position:relative;margin:22px 0 0;border-radius:28px;overflow:hidden;min-height:340px;perspective:1200px;background:var(--brand);color:#fff}
.bars{position:absolute;top:16px;left:20px;right:20px;display:flex;gap:6px;z-index:3}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer;position:relative}
.bars i::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.bars i.done::after{transform:scaleX(1)}
.bars i.on::after{animation:fill 7s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.scene{position:absolute;inset:0;padding:52px 32px 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:center;visibility:hidden;opacity:0;pointer-events:none;transform:translate3d(32px,0,0) rotateY(-9deg);transition:opacity .9s ease,transform 1s cubic-bezier(.22,.8,.3,1),visibility 0s 1s}
.scene.out{transform:translate3d(-32px,0,0) rotateY(9deg)}
.scene.on{visibility:visible;opacity:1;pointer-events:auto;transform:none;transition-delay:0s}
.scene h2{font-size:clamp(26px,5vw,44px);line-height:1.08;margin:0 0 12px;letter-spacing:-1.2px}
.scene p{margin:0 0 22px;color:rgba(255,255,255,.88);font-size:18px;max-width:40ch}
.scene .btn{background:#fff;color:var(--ink)}
.stage{height:220px;perspective:700px;display:grid;place-items:center}
.cube{width:110px;height:110px;position:relative;transform-style:preserve-3d;animation:spin 20s linear infinite}
.cube b{position:absolute;inset:0;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35)}
.cube b svg{width:46px;height:46px;stroke:#fff;stroke-width:1.6}
.cube b:nth-child(1){transform:translateZ(55px)}.cube b:nth-child(2){transform:rotateY(90deg) translateZ(55px)}.cube b:nth-child(3){transform:rotateY(180deg) translateZ(55px)}.cube b:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}.cube b:nth-child(5){transform:rotateX(90deg) translateZ(55px)}.cube b:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}
@keyframes spin{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.bnav{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;z-index:3}
.bnav .rb{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.banner::before,.banner::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.banner::before{width:440px;height:440px;right:-130px;top:-170px}
.banner::after{width:260px;height:260px;left:-90px;bottom:-130px}
.scene{z-index:1}
.vis{position:relative;height:230px}
.vc{position:absolute;width:236px;padding:14px;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 18px 40px -18px rgba(5,15,60,.6)}
.vc.a{left:0;top:6px;transform:rotate(-3deg);animation:fl 6s ease-in-out infinite}
.vc.b{right:0;bottom:4px;transform:rotate(3deg);animation:fl 6s ease-in-out -3s infinite}
@keyframes fl{50%{translate:0 -8px}}
.vc b{display:block;line-height:1.25}
.vc .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.vc .av{width:42px;height:42px;font-size:15px}
.vc.ok{display:flex;gap:10px;align-items:center}.vc.ok .ic{width:30px;height:30px;color:var(--call)}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}.pill.g{background:var(--call)}.pill.t{background:var(--tg)}
.ln{height:8px;border-radius:4px;background:#e5e7eb;margin:10px 0}.ln.s{width:60%}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.st{display:grid;gap:6px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.st .n{width:34px;height:34px;border-radius:50%;background:#eef2ff;color:var(--brand);display:grid;place-items:center;font-weight:800}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;margin-top:40px;padding:26px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.about p{margin:0;color:var(--mute)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts b{display:block;font-size:30px;letter-spacing:-1px}.facts span{font-size:13px;color:var(--mute)}
#pv{pointer-events:none}
@media(max-width:640px){.vis{display:none}.about{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.vc{animation:none}}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{display:grid;gap:6px;justify-items:start;text-align:left;padding:16px;border-radius:var(--r);border:2px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer}
.role .ic{width:28px;height:28px;color:var(--brand)}
.role.on{border-color:var(--brand);background:#eef2ff}
.ah{display:flex;gap:14px;align-items:center;margin:28px 0 12px}
.good{color:#15803d;font-weight:600}
.banner,.ringwrap{touch-action:pan-y}
.gate .tabs{display:none}
.seg{display:flex;gap:4px;padding:4px;background:#e8eaef;border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font:inherit;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
.rt{font-weight:800;color:#b45309}
.stars{display:flex;gap:2px}.stars button{border:0;background:none;font-size:30px;line-height:1;padding:2px;color:#cbd5e1;cursor:pointer}.stars button.on{color:#f59e0b}
.chat{display:flex;flex-direction:column;gap:8px;height:55vh;min-height:280px;overflow-y:auto;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.bb{max-width:78%;padding:9px 13px;border-radius:16px;background:#eef0f4;align-self:flex-start;overflow-wrap:anywhere}
.bb.me{align-self:flex-end;background:var(--brand);color:#fff}
.cf{display:flex;gap:8px;margin-top:10px}.cf input{flex:1}.cf .btn{padding:0 18px}
.cw{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(15,23,42,.45)}
.cw.open{display:flex}
.cwi{width:min(520px,100%);padding:14px;background:var(--bg);border-radius:22px;box-shadow:0 20px 60px -20px rgba(15,23,42,.5)}
.cwi .chat{height:48vh}
.cwh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
/* услуги */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);text-decoration:none;font-weight:600;transition:border-color .2s,transform .2s}
.chip:hover{border-color:var(--c1);transform:translateY(-2px)}
.dot,.sv .ib{display:grid;place-items:center;border-radius:50%;background:var(--c1);flex:none}
.dot{width:34px;height:34px}.dot svg{width:18px;height:18px;stroke:#fff}
.ringwrap{position:relative;height:220px;perspective:900px;overflow:hidden}
.ring{position:absolute;left:50%;top:50%;width:130px;height:150px;margin:-75px 0 0 -65px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.22,.8,.3,1)}
.cat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:22px;text-decoration:none;font-weight:700;font-size:15px;color:#fff;background:var(--c1);box-shadow:0 16px 30px -16px var(--c1);transform:rotateY(calc(var(--i)*51.4286deg)) translateZ(200px);backface-visibility:hidden}
.cat .ib{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.cat .ib svg{width:30px;height:30px;stroke:#fff}
.ringwrap .rb{position:absolute;top:50%;margin-top:-22px;z-index:2}
.rp{left:4px}.rn{right:4px}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.sv{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);text-decoration:none;background:#fff;border:1px solid var(--line);transition:border-color .2s,transform .2s}
.sv:hover{border-color:var(--c1);transform:translateY(-2px)}
.sv .ib{width:54px;height:54px}.sv .ib svg{width:26px;height:26px;stroke:#fff}
.sv b{display:block;font-size:17px}
/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,23,42,.04);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,border-color .2s,box-shadow .2s}
.mc.tilt{border-color:#c7d2fe;box-shadow:0 20px 40px -22px rgba(37,71,245,.45)}
.mc .top{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;object-fit:cover}
.av.big{width:84px;height:84px;font-size:30px}
.mc h3{margin:0;font-size:18px;line-height:1.2}
.meta{color:var(--mute);font-size:14px}
.price{font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.actions.col{grid-template-columns:1fr}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:16px 0}
form.f{display:grid;gap:14px;max-width:560px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
.hint{font-weight:400;color:var(--mute);font-size:13px}
.msg{padding:16px;border-radius:14px;background:#ecfdf5;border:1px solid #86efac;color:#14532d;font-weight:600}
.err{color:var(--err);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--mute);border:1.5px dashed #cbd5e1;border-radius:var(--r);background:#fff}
.crumb{display:inline-block;margin:18px 0 6px;color:var(--mute);text-decoration:none;font-weight:600}
.cta{margin:40px 0;padding:26px;border-radius:var(--r);background:var(--navy);color:#fff;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{margin:0 0 4px}.cta .btn{background:#fff;color:var(--ink)}
footer{padding:24px 0 20px;color:var(--mute);font-size:14px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--brand);cursor:pointer;text-decoration:underline}
/* нижняя панель: и на телефоне, и на ПК */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));z-index:25;padding:6px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px -12px rgba(15,23,42,.28)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 0;border-radius:16px;transition:background .2s,color .2s}
.tabs a .ic{width:23px;height:23px}
.tabs a:hover{background:#f1f5f9}
.tabs a.on{color:var(--brand);background:#eef2ff}
/* 3D-переход между страницами */
#ghost{position:fixed;top:0;z-index:15;pointer-events:none;overflow:hidden;transform-origin:50% 40vh;animation:gout .8s cubic-bezier(.5,0,.2,1) forwards}
#app.in{transform-origin:50% 40vh;animation:gin .9s cubic-bezier(.22,.8,.3,1) .12s backwards}
@keyframes gout{0%{opacity:1;transform:perspective(1600px) translate3d(0,0,0) rotateY(0)}55%{opacity:0}100%{opacity:0;transform:perspective(1600px) translate3d(calc(var(--d,1)*-48%),0,-380px) rotateY(calc(var(--d,1)*58deg))}}
@keyframes gin{0%{opacity:0;transform:perspective(1600px) translate3d(calc(var(--d,1)*48%),0,-380px) rotateY(calc(var(--d,1)*-58deg))}45%{opacity:0}100%{opacity:1;transform:perspective(1600px) translate3d(0,0,0) rotateY(0)}}
@media(max-width:640px){
 .banner{min-height:410px}
 .scene{grid-template-columns:1fr;align-content:center;padding:46px 22px 76px}
 .stage{height:130px}.cube{transform:scale(.72)}
 .search .btn{padding:0 16px}
}
@media(prefers-reduced-motion:reduce){.cube{animation:none}.bars i.on::after{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/">Мастер<b>ПМР</b></a>
  <nav><a data-p="services" href="#/services">Услуги</a><a data-p="list" href="#/list">Мастера</a><a data-p="request" href="#/request">Заявка</a><a data-p="add" href="#/add">Я мастер</a></nav>

<footer class="wrap">Мастер ПМР — каталог мастеров Приднестровья. Контакты в демо-карточках вымышлены. <button class="lnk" id="reset">Сбросить тестовые данные</button></footer>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {
  SUPABASE_URL: "",   // например https://abcd1234.supabase.co  (пусто = режим прототипа)
  SUPABASE_KEY: "",   // публичный anon-ключ из Supabase → Project Settings → API
  ADMIN_TG: ""        // ваш Telegram без @ — сюда можно присылать заявки (необязательно)
};
const CATS = [
  ["santeh","Сантехник","#2563eb","#2563eb","Трубы, смесители, установка техники"],
  ["electric","Электрик","#ca8a04","#ca8a04","Проводка, розетки, освещение"],
  ["repair","Ремонт","#dc2626","#dc2626","Отделка и ремонт квартир"],
  ["beauty","Красота","#db2777","#db2777","Маникюр, причёски, косметология"],
  ["tutor","Репетиторы","#16a34a","#16a34a","Школьные предметы и языки"],
  ["moving","Перевозки","#7c3aed","#7c3aed","Грузчики и грузоперевозки"],
  ["cleaning","Уборка","#0891b2","#0891b2","Квартиры, офисы, окна"]
];
const ICONS = {
  santeh:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  electric:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  repair:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v6M15 10v5M9 15v5"/>',
  beauty:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  tutor:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/>',
  moving:'<path d="M2 5h11v11H2z"/><path d="M13 8h4l4 4v4h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  cleaning:'<circle cx="9" cy="14.5" r="5.5"/><circle cx="17.5" cy="7.5" r="3"/><circle cx="18.5" cy="17" r="2"/><path d="M6.5 13.5a3 3 0 0 1 2.2-2.2"/>',
  note:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>',
  phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  home:'<path d="M3 11 12 3l9 8M5 10v11h14V10M10 21v-6h4v6"/>',
  send:'<path d="M21 3 3 10.5l6.5 2.5L12 20l2.5-5.5z"/><path d="M9.5 13 21 3"/>'
};
Object.assign(ICONS,{
  grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5a5 5 0 0 1 4.5 5"/>',
  adduser:'<circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0 1 12-4.9"/><path d="M19 14v6M16 17h6"/>'
});
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const CITIES = ["Тирасполь","Бендеры","Рыбница","Дубоссары","Григориополь","Слободзея","Каменка","Днестровск"];

const useDB = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const sb = (path, opt={}) => fetch(CONFIG.SUPABASE_URL + "/rest/v1/" + path, {
  ...opt, headers: {apikey: CONFIG.SUPABASE_KEY, Authorization: "Bearer " + CONFIG.SUPABASE_KEY,
  "Content-Type": "application/json", Prefer: "return=minimal", ...(opt.headers||{})}
});
const mem = {};
const ls = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); if (v) return v; } catch(e){} return mem[k] || d; },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let masters = [];
async function loadMasters(){
  if (useDB) {
    try {
      const r = await sb("masters?approved=eq.true&select=*&order=created_at.desc");
      if (!r.ok) throw new Error(r.status);
      masters = await r.json(); return;
    } catch(e){ console.error("Supabase:", e); }
  }
  masters = [...ls.get("pmr_masters", []), ...DEMO];
}
async function saveMaster(m){
  if (useDB) {
    const r = await sb("masters", {method:"POST", body: JSON.stringify({...m, approved:false})});
    if (!r.ok) throw new Error("save");
    return;
  }
  const list = ls.get("pmr_masters", []);
  const id = "u" + Date.now(); list.unshift({...m, id}); ls.set("pmr_masters", list); return id;
}
async function saveRequest(q){
  if (useDB) {
    const r = await sb("requests", {method:"POST", body: JSON.stringify(q)});
    if (!r.ok) throw new Error("save");
    return;
  }
  const list = ls.get("pmr_requests", []); list.unshift(q); ls.set("pmr_requests", list);
}

async function hp(pw, salt){
  if (!(window.crypto && crypto.subtle)) return btoa(unescape(encodeURIComponent(salt + ":" + pw)));
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

      e.preventDefault(); const t = cf.t.value.trim(); if (!t) return;
      const l = chats(), mid = cm.dataset.mid, cid = cm.dataset.cid; let c = l.find(x => x.mid === mid && x.cid === cid);
      if (!c) { c = {mid, cid, msgs:[]}; l.push(c); }
      c.msgs.push({f:cm.dataset.role, t, ts:Date.now()});
      const m = masters.find(x => String(x.id) === mid);
      if (m && !m.uid && c.msgs.length === 1) c.msgs.push({f:"m", t:"Здравствуйте! Это тестовый мастер из демо-каталога, живого ответа не будет.", ts:Date.now()});
      ls.set("pmr_chats", l); cf.t.value = ""; cm.innerHTML = chatMsgs(mid, cid, cm.dataset.role); cm.scrollTop = cm.scrollHeight;
    };
  }
  const cw = $("#cw");
  if (cw) {
    $("#co").onclick = () => { cw.classList.add("open"); const cm = $("#cm"); cm.scrollTop = cm.scrollHeight; $("#cf").t.focus(); };
    $("#cx").onclick = () => cw.classList.remove("open");
    cw.onclick = e => { if (e.target === cw) cw.classList.remove("open"); };
  }
  const rf = $("#rf");
  if (rf) rf.onsubmit = rf.querySelector("button[type=submit]").onclick = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(rf)); const er = $("#er");
    if (!d.text.trim() || !d.contact.trim()) return er.textContent = "Опишите задачу и оставьте контакт.";
    try { await saveRequest({...d, id:"r" + Date.now(), uid:(me() || {}).id, text:d.text.trim(), contact:d.contact.trim()});
      const admin = tgUser(CONFIG.ADMIN_TG);
      const extra = admin ? `<p><a class="btn tg" target="_blank" rel="noopener" href="https://t.me/${admin}?text=${encodeURIComponent("Заявка: " + d.text + " (" + catName(d.category) + ", " + d.city + "). Контакт: " + d.contact)}">Отправить также в Telegram</a></p>` : "";
      const mm = masters.filter(m => m.category === d.category).slice(0, 3);
      $("#app").innerHTML = done("Заявка отправлена. Мастера свяжутся с вами.", extra + (mm.length ? `<h2>Мастера, которым ушла заявка</h2><div class="grid">${mm.map(card).join("")}</div>` : "")); }
    catch(x){ er.textContent = "Не получилось отправить. Попробуйте ещё раз."; }
  };
}
function renderList(p){ // обновляет только список, чтобы не терять фокус в поиске
  const tmp = document.createElement("div"); tmp.innerHTML = list(p);
  $("#app").querySelector(".meta").outerHTML = tmp.querySelector(".meta").outerHTML;
  const old = $("#app").querySelector(".grid, .empty"); const nw = tmp.querySelector(".grid, .empty");
  if (old && nw) old.replaceWith(nw);
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function swipe(el, fn){
  let x0 = null, y0 = 0;
  el.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) fn(dx < 0 ? 1 : -1); });
  el.addEventListener("pointercancel", () => { x0 = null; });
}
function initHome(){
  const bn = $("#bn");
  if (bn) {
    const sc = [...bn.querySelectorAll(".scene")], bars = [...bn.querySelectorAll(".bars i")]; let cur = -1;
    const show = i => {
      clearTimeout(window._bt); const prev = cur; cur = (i + sc.length) % sc.length;
      sc.forEach((s,k) => { s.classList.toggle("on", k === cur); s.classList.toggle("out", k === prev && k !== cur); });
      bars.forEach((b,k) => { b.classList.remove("on"); b.classList.toggle("done", k < cur); });
      void bn.offsetWidth; bars[cur].classList.add("on");
      if (!reduce) window._bt = setTimeout(() => show(cur + 1), 7000);
    };
    bars.forEach((b,k) => b.onclick = () => show(k));
    bn.querySelector(".prev").onclick = () => show(cur - 1);
    bn.querySelector(".next").onclick = () => show(cur + 1);
    show(0);
    swipe(bn, d => show(cur + d));
  }
  const ring = $("#ring");
  if (ring) {
    let a = 0; const step = 360 / CATS.length;
    const turn = d => { a += d * step; ring.style.transform = `translateZ(-200px) rotateY(${-a}deg)`; };
    $("#rp").onclick = () => turn(-1); $("#rn").onclick = () => turn(1);
    turn(0);
    swipe($("#rw"), d => turn(d));
    if (!reduce) { window._ring = setInterval(() => turn(1), 4000); $("#rw").onpointerenter = () => clearInterval(window._ring); }
  }
}
addEventListener("pointermove", e => {
  if (reduce || e.pointerType !== "mouse") return;
  const c = e.target.closest && e.target.closest(".mc");
  document.querySelectorAll(".mc.tilt").forEach(x => { if (x !== c) { x.classList.remove("tilt"); x.style.removeProperty("--rx"); x.style.removeProperty("--ry"); } });
  if (!c) return;
  const r = c.getBoundingClientRect(); c.classList.add("tilt");
  c.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 14 + "deg");
  c.style.setProperty("--rx", -((e.clientY - r.top) / r.height - .5) * 14 + "deg");
});
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); go(a.getAttribute("href").slice(1));
});
document.addEventListener("click", e => { const c = e.target.closest && e.target.closest(".mc[data-href]"); if (c && !e.target.closest("a,button")) go(c.dataset.href); });
addEventListener("popstate", () => { curPath = location.hash.slice(1) || "/"; route(); });
$("#reset").onclick = () => { ls.set("pmr_masters", []); ls.set("pmr_requests", []); ls.set("pmr_reviews", []); ls.set("pmr_chats", []); ls.set("pmr_users", []); ls.set("pmr_session", null); masters = []; curPath = "/"; try { history.replaceState(null, "", "#/"); } catch(x){} route(); };
route();
